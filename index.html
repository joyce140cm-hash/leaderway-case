<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FF8401">
<title>立威個案管理（試用版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --orange:#FF8401; --deep:#FD4F00; --yellow:#F7DF62; --skin:#F2C49E; --cream:#F9EBDB; --white:#fff;
  --ink:#3A2A20; --muted:#8A7362; --line:#EBD3BC; --bg:#FBF6F0;
  --good:#3E8E5A; --warn:#C98A00; --bad:#D23B1E;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--white);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.top .mark{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700}
.top b{font-family:var(--display);letter-spacing:.06em}
.top .who{margin-left:auto;font-size:13px;color:var(--muted);text-align:right;line-height:1.3}
.top .who strong{color:var(--ink);display:block}
.demo{background:var(--yellow);color:var(--ink);font-size:12px;text-align:center;padding:4px 12px}
main{max-width:860px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.side{position:fixed;top:0;bottom:0;left:0;width:236px;background:var(--white);border-right:1px solid var(--line);z-index:40;transform:translateX(-102%);transition:transform .2s;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 20px;overflow:auto}
body.menu .side{transform:none}
.scrim{display:none;position:fixed;inset:0;background:rgba(40,25,15,.35);z-index:35}
body.menu .scrim{display:block}
.side .brand{display:flex;gap:10px;align-items:center;padding:4px 10px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side .brand .mark{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700}
.side .brand b{font-family:var(--display);letter-spacing:.06em}
.side button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:8px;font-size:15px}
.side button.on{background:var(--cream);color:var(--deep);font-weight:700}
.side button .tag{font-size:11px;color:var(--muted);font-weight:400}
.side .sec{font-size:11px;color:var(--muted);padding:14px 12px 4px;letter-spacing:.12em}
.hamb{border:1px solid var(--line);background:#fff;border-radius:8px;width:38px;height:38px;font-size:18px;line-height:1;flex:0 0 auto}
@media (min-width:1000px){.side{transform:none}.scrim{display:none!important}.hamb{display:none}body.authed .top,body.authed main,body.authed .demo{margin-left:236px}}
.duty-shifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.duty-shifts>div{background:var(--cream);border-radius:8px;padding:8px 10px;font-size:13px;min-width:0}
.duty-shifts b{display:block;font-family:var(--display);margin-bottom:2px}
@media (max-width:520px){.duty-shifts{grid-template-columns:1fr}}
.equip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.equip figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.equip figure.wide{grid-column:1/-1}
.equip img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff}
.equip figure.wide img{aspect-ratio:auto}
.equip figcaption{font-size:12px;padding:6px 10px;background:var(--cream)}
h1{font-family:var(--display);font-size:22px;margin:4px 0 12px;letter-spacing:.06em}
h2{font-family:var(--display);font-size:17px;margin:0 0 10px;letter-spacing:.06em}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--white);border-radius:10px;padding:10px 14px;font-weight:500}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.deep{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
textarea.i{min-height:150px}
.pill{display:inline-block;font-size:12px;border-radius:99px;padding:1px 10px;background:var(--cream);color:var(--deep);font-weight:700;white-space:nowrap}
.pill.g{background:#E5F3EA;color:var(--good)} .pill.y{background:#FBF1CC;color:#8A6200} .pill.r{background:#FBE1DA;color:var(--bad)}
.muted{color:var(--muted);font-size:13px}
.list .it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .grow b{display:block}
.duty{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.duty dt{color:var(--muted)} .duty dd{margin:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:90%}
.modal{position:fixed;inset:0;background:rgba(40,25,15,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheetbox{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
/* login */
.login{max-width:380px;margin:8vh auto;padding:0 16px}
.login .logo{display:flex;gap:12px;align-items:center;margin-bottom:24px}
.login .logo .mark{width:48px;height:48px;font-size:22px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700}
/* marking */
.hint{font-size:12px;color:var(--muted);background:var(--cream);border-radius:8px;padding:6px 10px;margin-bottom:10px}
.status-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.status-bar button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:14px}
.status-bar button.on{border-color:var(--deep);background:var(--deep);color:#fff}
.xwrap{position:relative;border-radius:8px;overflow:hidden;background:#111;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.xwrap img{display:block;width:100%;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;pointer-events:none;box-shadow:0 0 2px #000}
.mk i{position:absolute;left:50%;transform:translateX(-50%);font-style:normal;font-size:9px;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 0 2px #000;white-space:nowrap;line-height:1}
.mk.up i{bottom:9px}.mk.dn i{top:9px}
.xscroll{overflow-x:auto;border-radius:8px;-webkit-overflow-scrolling:touch}
.xscroll.zoom .xwrap{width:230%}
.xscroll.zoom .mk{width:11px;height:11px}.xscroll.zoom .mk i{font-size:11px}
.next{font-weight:700;color:var(--deep)}
.tgrid{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:2px;margin:10px 0}
.tgrid button{border:1.2px solid #C9B09A;border-radius:5px;background:#fff;font-size:10px;padding:5px 0;line-height:1.1}
.tgrid button.sel{outline:2px solid var(--ink)}
.tgrid .gap{grid-column:span 16;height:6px}
/* checklist */
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.chk li:last-child{border-bottom:0}
.dot{flex:0 0 12px;height:12px;border-radius:50%;margin-top:5px}
.dot.g{background:var(--good)}.dot.y{background:#E8B400}.dot.r{background:var(--bad)}
.items{width:100%;border-collapse:collapse;font-size:14px}
.items th{font-size:12px;color:var(--muted);text-align:left;font-weight:500;padding:4px}
.items td{padding:4px;border-top:1px solid var(--line);vertical-align:top}
.items input,.items select{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:14px;background:#fff}
.tablewrap{overflow-x:auto}
/* versions */
.mcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.mc{all:unset;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.mc img,.mc-ph{width:100%;aspect-ratio:2/1;object-fit:cover;background:#222;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:14px}.mc-t{padding:8px 10px 2px;font-size:14px}.mc-s{padding:0 10px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{margin:0;flex:1}
details.sec>summary::after{content:'▾';color:var(--muted)}details.sec:not([open])>summary::after{content:'▸'}
details.sec[open]>summary{margin-bottom:10px}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.ev{background:var(--cream);border-radius:10px;padding:10px 12px}.ev b{font-family:var(--display);font-size:16px}.ev dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-size:13px}.ev dt{color:var(--muted)}.ev dd{margin:0;font-weight:700}
.bar{height:8px;background:var(--cream);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%}
.tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:14px}.tabs button.on{background:var(--deep);border-color:var(--deep);color:#fff}
.dh{font-size:14px;margin:10px 0 4px}.df{padding:4px 0;border-bottom:1px dashed var(--line);font-size:14px}
.pe{border-top:1px solid var(--line);padding:10px 0}.pe.rm{opacity:.45}.pe.rm input.grow{text-decoration:line-through}
.pe-g{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:6px}.pe-g label,.pe-g2 label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}.pe-g input,.pe-g2 input{border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:14px;width:100%}.pe-g label.ck{flex-direction:row;align-items:center;gap:4px}.pe-g label.ck input{width:auto}
.pe-g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}@media (max-width:600px){.pe-g{grid-template-columns:repeat(3,minmax(0,1fr))}.pe-g2{grid-template-columns:1fr}}
.pe-img{position:relative;display:inline-block}.pe-img img{height:56px;border-radius:4px;display:block}.pe-img a{position:absolute;top:-6px;right:-6px;background:var(--ink);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:grid;place-items:center;text-decoration:none}
.ps-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:4px solid var(--orange);padding-bottom:10px}
.ps-cat h3{background:var(--deep);color:#fff;font-family:var(--display);letter-spacing:.12em;margin:0 0 6px;padding:6px 12px;font-size:16px}
.ps-t{width:100%;border-collapse:collapse;font-size:12.5px}.ps-t th{background:#E8E3DE;color:var(--muted);font-weight:500;text-align:left;padding:4px 8px}.ps-t td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}.ps-t td:first-child{width:30%}.ps-t .r{text-align:right;white-space:nowrap}
.syncdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#bbb;vertical-align:middle;margin-right:4px}.syncdot.ok{background:var(--good)}.syncdot.busy{background:#E8B400}.syncdot.bad{background:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:15px}.tile .n{font-size:28px;font-weight:700;line-height:1.1;color:var(--ink)}
.tile.y .n{color:#8A6200}.tile.r .n{color:var(--bad)}.tile.g .n{color:var(--good)}
.tile.on{border-color:var(--deep);background:var(--cream)}
.sec-t{font-size:12px;color:var(--muted);letter-spacing:.12em;margin:6px 0 6px}
.side .cnt{margin-left:auto;margin-right:6px;background:var(--deep);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700;line-height:18px}
.pinfo{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 0;font-size:15px}.pinfo dt{color:var(--muted);font-size:13px;padding-top:2px}.pinfo dd{margin:0}
.next-btn{margin:0 0 14px;font-size:16px;padding:13px}.next-btn.wait{background:var(--cream);border-radius:10px;text-align:center;color:var(--muted);font-size:14px;padding:10px}
select.mini{border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;max-width:120px}
.vers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ver{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--cream);text-align:left}
.ver b{display:block;font-family:var(--display)}
/* ===== plan sheet ===== */
#sheetWrap{display:flex;flex-direction:column;gap:18px}
.sheet{background:#fff;max-width:794px;width:100%;margin:0 auto;box-shadow:0 1px 2px rgba(80,40,10,.08),0 10px 28px rgba(80,40,10,.08);padding:36px 40px;display:flex;flex-direction:column;gap:20px;font-size:14px}
@media (max-width:600px){.sheet{padding:22px 16px}}
.s-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.s-brand{display:flex;gap:10px;align-items:center}
.s-brand .m{width:36px;height:36px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.s-brand b{display:block;font-family:var(--display);letter-spacing:.06em}
.s-brand small{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted)}
.s-meta{font-size:12px;color:var(--muted);text-align:right}
.s-title{font-family:var(--display);font-size:28px;letter-spacing:.2em;margin:0}
.s-title span{color:var(--orange)}
.s-h{font-family:var(--display);font-size:16px;letter-spacing:.12em;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.s-h::before{content:"";width:8px;height:8px;background:var(--orange);transform:rotate(45deg)}
.s-info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--cream);border-radius:6px}
.s-info div{padding:9px 14px;border-left:1px solid var(--line)}
.s-info div:nth-child(3n+1){border-left:0}
.s-info dt{font-size:11px;color:var(--muted);letter-spacing:.1em}
.s-info dd{margin:0;font-weight:700}
@media (max-width:600px){.s-info{grid-template-columns:repeat(2,minmax(0,1fr))}.s-info div{border-left:0}}
.s-xray{border-radius:4px;overflow:hidden;background:#222}
.s-xray img{display:block;width:100%}
.s-xray.empty{aspect-ratio:2.2/1;display:grid;place-items:center;color:#aaa;font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:13px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.2px solid #C9B09A}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.rec{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border:1px solid var(--line);border-radius:6px}
.rec .t{font-weight:700;color:var(--deep);white-space:nowrap;font-variant-numeric:tabular-nums}
.fees{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.fees th{font-size:11px;color:var(--muted);font-weight:500;text-align:left;padding:5px 6px;border-bottom:1px solid var(--ink)}
.fees td{padding:7px 6px;border-bottom:1px solid var(--line)}
.fees .r{text-align:right}
.fees tr.g td{background:var(--cream);font-family:var(--display);font-weight:700;letter-spacing:.06em}
.fees td.t{color:var(--deep);font-weight:700;white-space:nowrap}
.fees tr.minus td{color:var(--good)}
.total{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:12px}
.total .sum{font-family:var(--display);letter-spacing:.1em}
.total .sum{text-align:right}.total .sum strong{font-size:28px;color:var(--deep);margin-left:8px;background:linear-gradient(transparent 62%,var(--yellow) 62%,var(--yellow) 92%,transparent 92%);padding:0 4px;letter-spacing:.02em}
.pay{margin:0;padding-left:1.2em;font-size:13px}
.sign{border:1px solid var(--ink);border-radius:4px;padding:14px 18px;display:flex;flex-direction:column;gap:16px}
.sign p{margin:0;font-size:13px}
.sign-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.sign-row div{border-bottom:1px solid var(--ink);min-height:56px;display:flex;align-items:flex-end;justify-content:space-between;font-size:11px;color:var(--muted)}
.sign-row img{height:52px}
@media (max-width:600px){.sign-row{grid-template-columns:1fr}}
.s-foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap;gap:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
body.present .top,body.present .side,body.present .scrim,body.present .demo,body.present .toolbar,body.present .internal{display:none}
body.present.authed .top,body.present.authed main{margin-left:0}
body.present main{max-width:none;padding:0}
body.present .exitp{display:block}
.exitp{display:none;position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:30}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.photos img{width:100%;border-radius:4px;display:block}
.ann{position:relative;container-type:inline-size}
.ann .a-num{position:absolute;transform:translate(-50%,-50%);font-size:2.6cqw;font-weight:700;color:#fff;background:rgba(0,0,0,.55);border-radius:4px;padding:0 .4cqw;line-height:1.35}
.ann .a-num.hot{background:#FD4F00}
.ann .a-ic{position:absolute;transform:translate(-50%,-50%);display:block}
.ann .a-xx{position:absolute;transform:translate(-50%,-50%);font-size:3.4cqw;color:#d8cfc8;letter-spacing:-.4cqw;text-shadow:0 0 3px #000}
.ann .a-xx.red{color:#ff5a3c}
.ann .a-x{position:absolute;transform:translate(-50%,-50%);font-size:4.6cqw;font-weight:700;color:#FD4F00;text-shadow:0 0 3px #000;line-height:1}
.ann .a-rect{position:absolute;transform:translate(-50%,-50%);width:3.2%;height:9%;border:2px solid #fff;border-radius:2px;box-shadow:0 0 3px #000}
.ann .a-dot{position:absolute;transform:translate(-50%,-50%);width:1.6%;aspect-ratio:1;border-radius:50%;background:#ff7a59}
.ann .a-graft{position:absolute;transform:translate(-50%,-50%);width:4.6%;aspect-ratio:1;border:2px dashed #F2C49E;border-radius:50%}
.ann .a-bridge{position:absolute;border:2.5px solid #F7DF62;border-radius:10px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.team div{background:var(--cream);border-radius:6px;padding:8px 12px}
.team b{display:block}.team span{font-size:12.5px;color:var(--muted)}
s.was{color:#9a8b80;font-weight:400;font-size:12px}
b.now{color:var(--deep)}
.s-sub{margin:-12px 0 0;font-size:12.5px;color:var(--deep);letter-spacing:.04em}

    for(const row of r.rows.sort((a,b)=>a.ts-b.ts))if(applyRemote(row))changed=true;
    SY.since=Math.max(SY.since||0,r.ts||0);
    // 2. 推本機
    const ch=[];const seen=new Set();
    for(const x of recs()){const key=x.col+':'+x.id;seen.add(key);if(await uploadImgs(x.obj,x.name))changed=true;const j=JSON.stringify(x.obj);if(SHADOW[key]!==j)ch.push({col:x.col,id:x.id,json:j,key})}

    if(ch.length){const res=await api({action:'push',by:me()?me().name:'',changes:ch.map(c=>({col:c.col,id:c.id,json:c.json,deleted:c.deleted}))});for(const c of ch){if(c.deleted)delete SHADOW[c.key];else SHADOW[c.key]=c.json}SY.since=Math.max(SY.since,res.ts)}

    if(changed&&!opts.quiet)softRender();

  if(syncSt.again){syncSt.again=false;setTimeout(()=>syncNow({quiet:true}),300)}
}

function dutyOf(day){

function rgbOf(f){if(!f)return null;const x=String(f.rgb||'').toUpperCase().slice(-6);if(!/^[0-9A-F]{6}$/.test(x))return null;return [parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)]}
const isPink=c=>!!c&&c[0]>=0xE0&&c[2]>=0x99&&c[1]<=0xCC&&c[0]-c[1]>=0x33;
const isRed=c=>!!c&&c[0]>=0x90&&c[1]<=0x50&&c[2]<=0x50;
const isOrange=c=>!!c&&c[0]>=0xF0&&c[1]>=0xA0&&c[1]<=0xD0&&c[2]<=0x40;
function parseRoster(wb,m){
  const name=wb.SheetNames.find(n=>n.replace(/\s/g,'')===m+'月助理')||wb.SheetNames.find(n=>n.replace(/\s/g,'').startsWith(m+'月助理'));
  if(!name)return {err:'找不到「'+m+'月助理」工作表'};
  const ws=wb.Sheets[name];const rg=XLSX.utils.decode_range(ws['!ref']);
  const cell=(r,c)=>ws[XLSX.utils.encode_cell({r,c})];
  const names=[];for(let c=3;c<=rg.e.c;c++){const v=cell(0,c);const t=v&&v.v!=null?String(v.v).trim():'';if(!t||/到這裡/.test(t))break;names.push({c,n:t})}
  const days={};let cur=null;
  for(let r=1;r<=rg.e.r;r++){
    const a=cell(r,0),sh=cell(r,2);
    if(a&&a.v!=null&&/^\d{1,2}(\D|$)/.test(String(a.v).trim())){const t=String(a.v).trim().split(/\r?\n/);cur=+t[0].match(/^\d+/)[0];days[cur]=days[cur]||{note:t.slice(1).join(' ').trim(),shifts:{}}}
    const shv=sh&&sh.v!=null?String(sh.v).trim():'';
    if(!cur||!['早','午','晚'].includes(shv))continue;
    const row={};
    for(const {c,n} of names){const x=cell(r,c);const code=x&&x.v!=null?String(x.v).trim():'';const f=x&&x.s&&x.s.fgColor;const rgb=rgbOf(f);
      const sup=!!(f&&((f.theme===6&&f.tint>0.3)||String(f.rgb||'').toUpperCase().endsWith('D7E4BD')));
      const duty=isPink(rgb);const dayoff=!code&&isRed(rgb);const leave=/特/.test(code)||(!code&&isOrange(rgb));
      if(code||sup||duty||dayoff||leave)row[n]={code,sup,duty,dayoff,leave}}
    days[cur].shifts[shv]=row;
  }
  return {sheet:name,names:names.map(x=>x.n),days};
}

function txtOf(wb,path){const f=wb.files&&(wb.files[path]||wb.files['/'+path]);if(!f)return '';const c=f.content;return typeof c==='string'?c:new TextDecoder().decode(c instanceof Uint8Array?c:new Uint8Array(c))}
function strikeCells(wb,sheetName){
  const out=new Set();
  try{
    const wbx=txtOf(wb,'xl/workbook.xml'),rels=txtOf(wb,'xl/_rels/workbook.xml.rels'),sty=txtOf(wb,'xl/styles.xml');if(!wbx||!rels||!sty)return out;
    const attr=(tag,n)=>{const m=tag.match(new RegExp('\\b'+n+'="([^"]*)"'));return m?m[1]:null};
    const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const sh=(wbx.match(/<sheet\b[^>]*>/g)||[]).find(t=>attr(t,'name')===sheetName||attr(t,'name')===esc(sheetName));if(!sh)return out;
    const rid=attr(sh,'r:id');const rel=(rels.match(/<Relationship\b[^>]*>/g)||[]).find(t=>attr(t,'Id')===rid);if(!rel)return out;
    const sx=txtOf(wb,'xl/'+attr(rel,'Target').replace(/^\/?xl\//,'').replace(/^\//,''));if(!sx)return out;
    const isStrike=x=>/<strike(?![^>]*val="(0|false)")[^>]*\/?>/.test(x);
    const fontsBlk=(sty.match(/<fonts\b[\s\S]*?<\/fonts>/)||[''])[0];
    const fonts=(fontsBlk.match(/<font\b[^>]*\/>|<font\b[^>]*>[\s\S]*?<\/font>/g)||[]).map(isStrike);
    const xfBlk=(sty.match(/<cellXfs\b[\s\S]*?<\/cellXfs>/)||[''])[0];

const SHOOT_RE=/拍|影片|case|ba照|ba 照|ba圖|錄影/i;
const CANCEL_RE=/拒絕|取消|del\b|改期/i;
function parseEditor(wb,y,m){
  const roc=y-1911,name=String(roc)+String(m).padStart(2,'0');
  const sheet=wb.SheetNames.find(n=>n.trim()===name);if(!sheet)return {err:'找不到「'+name+'」工作表'};
  const ws=wb.Sheets[sheet];const rg=XLSX.utils.decode_range(ws['!ref']);const cell=(r,c)=>ws[XLSX.utils.encode_cell({r,c})];
  const val=(r,c)=>{const x=cell(r,c);return x&&x.v!=null?String(x.v).trim():''};
  const strike=strikeCells(wb,sheet);
  let hr=-1,cols=[];
  for(let r=0;r<=Math.min(rg.e.r,15)&&hr<0;r++){const cs=[];for(let c=0;c<=rg.e.c;c++)if(val(r,c)==='一')cs.push(c);if(cs.length){const c0=cs[0];const wk=['一','二','三','四','五','六','日'];const found=[];for(let c=c0;c<=rg.e.c&&found.length<7;c++)if(val(r,c)===wk[found.length])found.push(c);if(found.length===7){hr=r;cols=found}}}
  if(hr<0)return {err:'看不出月曆格式（找不到星期一到日的標題列）'};
  const weekRows=[];for(let r=hr+1;r<=rg.e.r;r++){if(cols.some(c=>{const x=cell(r,c);return x&&typeof x.v==='number'}))weekRows.push(r)}
  const days={};let started=false,ended=false,prev=0;
  weekRows.forEach((r,wi)=>{const end=wi+1<weekRows.length?weekRows[wi+1]:Math.min(rg.e.r+1,r+6);
    cols.forEach((c,ci)=>{const x=cell(r,c);if(!x||typeof x.v!=='number')return;const d=x.v;
      if(!started){if(d===1)started=true;else return}
      if(ended)return;if(d<prev){ended=true;return}prev=d;
      const label=val(r,c+1);const items=[];
      for(let rr=r+1;rr<end;rr++)for(const cc of [c,c+1]){const t=val(rr,cc);if(!t)continue;const ref=XLSX.utils.encode_cell({r:rr,c:cc});
        items.push({t,shoot:SHOOT_RE.test(t),cancel:strike.has(ref)||CANCEL_RE.test(t)})}
      const shift=/^早?午?晚?$/.test(label)&&label?label:'';
      days[d]={shift,label:shift?'':label,items};
    })});
  return {sheet,year:y,month:m,days};
}

function treatLabel(p){const q=signedQ(p)||p.quotes.at(-1);if(!q)return '未報價';const cats=[...new Set(q.items.filter(i=>!i.nhi&&!i.gift).map(i=>i.cat||'其他'))];return cats.join('、')||'健保治療'}
function locked(q){if(q.signed)return true;const d=new Date(q.ts);const n=new Date();return iso(d)!==iso(n)||n.getHours()>=21}

function evalReport(){

    const cnt=k=>cl.filter(p=>p.closed.eval.main===k).length;const tr={};cl.forEach(p=>p.closed.eval.traits.forEach(t=>tr[t]=(tr[t]||0)+1));const top=Object.entries(tr).sort((a,b)=>b[1]-a[1]).slice(0,2);
    const pc=x=>cl.length?Math.round(x/cl.length*100)+'%':'—';
    return `<div class="ev"><b>${h(n)}</b><dl><dt>報價</dt><dd>${q} 位</dd><dt>成交率</dt><dd>${q?Math.round(sg/q*100)+'%':'—'}</dd><dt>自評表</dt><dd>${cl.length} 份</dd><dt>我們可以更順</dt><dd>${pc(cnt('我們可以做得更順'))}</dd><dt>病人因素</dt><dd>${pc(cnt('病人個人因素'))}</dd><dt>兩者都有</dt><dd>${pc(cnt('兩者都有'))}</dd><dt>常見病人特質</dt><dd>${top.length?top.map(x=>h(x[0])).join('、'):'—'}</dd></dl></div>`});

function fixTrack(p){const h2=(p.nv||[]).filter(n=>n.status==='hold'&&n.hold);if(!h2.length){if(!(p.track||[]).length)p.trackDue=null;return}
  const f=h2.map(n=>n.hold.follow).sort()[0];p.trackDue=f;p.trackWhy=h2.map(n=>(n.doc?(DOCCH[n.doc]||n.doc[0])+'｜':'')+n.task+'：'+n.hold.reason).join('；')}

const myName=()=>{const u=me();return u?(u.link||u.name):''};

const sigISO=q=>q&&q.signedAt?String(q.signedAt).replace(/\./g,'-'):'';
function booked(p){return (p.nv||[]).some(n=>(n.dates||[]).length)||!!p.collect||!!(p.surgery&&p.surgery.date)}
function quoteLeft(q){return q.validDays-Math.floor((Date.now()-q.ts)/864e5)}
function bucket(p){
  if(p.closed||p.done)return 'closed';
  const sq=signedQ(p);
  if(sq){if(booked(p))return 'tx';return sigISO(sq)===todayISO()?'won':'track'}
  if(p.trackDue||(p.track||[]).length)return 'track';
  const q=p.quotes.at(-1);if(q&&quoteLeft(q)<0)return 'track';
  return 'open';
}
const BK={open:{t:'未成交',s:'報價期限內',c:'y'},track:{t:'追蹤',s:'過期待追回',c:'r'},won:{t:'成交',s:'已簽名待預約',c:'g'},tx:{t:'療程中',s:'',c:'g'},closed:{t:'已結案',s:'',c:''}};
function caseLabel(p){
  const b=bucket(p);
  if(b==='closed')return [p.closed?'未成交結案':'已結案',''];
  if(b==='open'){const q=p.quotes.at(-1);if(!p.teethDone&&!q)return ['待標牙位','y'];if(!q)return ['待貼醫囑','y'];return ['報價中・剩 '+Math.max(0,quoteLeft(q))+' 天','y']}
  if(b==='track'){const sq=signedQ(p);return [(sq?'已成交未預約・追蹤':'追蹤中')+((p.track||[]).length?'（'+p.track.length+' 次）':''),'r']}
  if(b==='won')return ['已成交・待預約','g'];
  const st=caseStage(p);return [st[0].startsWith('已簽名')?'療程中':st[0],st[1]||'g'];
}
function patRow(p){const s=caseLabel(p);return `<div class="it" onclick="go('patient',{pid:'${p.id}'})"><div class="grow"><b>${h(p.name)}</b><span class="muted">${h(p.chart||'病歷號待補')}・${p.doctor?h(p.doctor)+' 醫師':'醫師待補'}・諮詢 ${h(p.consult||'待補')}・個管 ${h(p.mgr||'待補')}</span></div><span class="pill ${s[1]}">${h(s[0])}</span></div>`}
function tiles(list,keys,cur,base){
  return `<div class="tiles">${keys.map(k=>{const n=list.filter(p=>bucket(p)===k).length;return `<button class="tile ${cur===k?'on':''} ${BK[k].c}" onclick="go('${base.name}',Object.assign(${h(JSON.stringify(base.o||{}))},{bk:'${k}'}))"><b>${BK[k].t}</b><span class="n">${n}</span><span class="muted">${BK[k].s||'件'}</span></button>`}).join('')}</div>`;
}
function bucketList(list,k){const L=list.filter(p=>bucket(p)===k).sort((a,b)=>(b.cts||0)-(a.cts||0));tmp.rl=L.map(p=>p.id);
  return `<div class="card"><div class="row" style="margin-bottom:4px"><h2 class="grow" style="margin:0">${BK[k].t}（${L.length}）</h2>${k==='open'||k==='track'?`<button class="btn sm" onclick="act.lostReport('${k}')">產出文字報表</button>`:''}</div><div class="list">${L.length?L.map(patRow).join(''):'<p class="muted">目前沒有。</p>'}</div></div>`}

function suggestOf(p){const q=p.quotes.at(-1);const n=(p.track||[]).length;const last=(p.track||[]).at(-1);
  if(signedQ(p))return '已簽名未預約，請約下次治療時間';
  if(!q)return '尚未報價，請確認醫囑';
  const left=quoteLeft(q);
  if(left>3)return '報價期限內，可主動關心考慮狀況'+(p.urgent?'；醫師交代積極追蹤':'');
  if(left>=0)return '報價快到期，建議致電確認意願';
  if(!n)return '報價已過期，請開始第 1 次追蹤';
  if(last&&/沒接|未讀/.test(last.result))return '前次沒聯繫上，建議換方式（電話／LINE）再聯繫';
  return '持續追蹤，可說明分期方式或和醫師討論方案調整';}
function lostText(ids){return ids.map(P).filter(Boolean).map((p,i)=>{const q=p.quotes.at(-1);const t=q?calc(p,q).total:null;const n=(p.track||[]).length;const last=(p.track||[]).at(-1);
  return `${i+1}. ${p.name}｜諮詢 ${p.consult||'待補'}｜${p.doctor||'醫師待補'}\n   報價：${q?'第 '+q.v+' 版 NT$ '+money(t)+'（'+q.date+'）':'尚未報價'}${q&&!q.signed?'｜'+(quoteLeft(q)>=0?'剩 '+quoteLeft(q)+' 天':'已過期 '+(-quoteLeft(q))+' 天'):''}\n   追蹤：${n?n+' 次，最後 '+last.at+' '+last.method+' '+last.result+(last.note?'（'+last.note+'）':''):'尚未追蹤'}\n   建議：${suggestOf(p)}`}).join('\n\n')}

function allTodos(){
  const out=[];
  for(const p of S.patients){
    if(p.closed||p.done)continue;const q=p.quotes.at(-1);const b=bucket(p);const mg=p.mgr?'（個管：'+p.mgr+'）':'';
    if(!p.teethDone&&!q)out.push({p,t:'待標牙位',c:'y',kind:'mark',to:()=>go('mark',{pid:p.id})});
    else if(!q)out.push({p,t:'待貼醫囑',c:'y',to:()=>go('orders',{pid:p.id})});
    else if(!q.signed&&!signedQ(p)){const left=quoteLeft(q);
      if(left<0&&!p.trackDue)out.push({p,t:'報價已過期，請開始追蹤'+mg,c:'r',to:()=>go('patient',{pid:p.id})});
      else if(left>=0&&left<=1)out.push({p,t:'報價明天到期，要追蹤'+mg,c:'r',to:()=>go('plan',{pid:p.id,v:q.v})});
      else if(left>1)out.push({p,t:'待簽名（還有 '+left+' 天）',c:'g',to:()=>go('plan',{pid:p.id,v:q.v})});}
    if(b==='won')out.push({p,t:'今天已成交，請登記預約'+mg,c:'g',to:()=>go('patient',{pid:p.id})});
    if(b==='track'&&signedQ(p)&&!p.trackDue)out.push({p,t:'已成交未預約，請追蹤'+mg,c:'r',to:()=>go('patient',{pid:p.id})});
  }
  for(const p of S.patients)if(p.done&&(p.xray||(p.photos||[]).length)&&addISO(p.done.pay,30)<=todayISO())out.push({p,t:'尾款日已滿 30 天：請備份後移除照片',c:'y',to:()=>go('patient',{pid:p.id})});
  for(const p of S.patients)if(!p.closed&&!p.done)(p.msgs||[]).forEach(m=>{if(!m.read)out.push({p,kind:'msg',t:'醫師交代：'+m.t.slice(0,24),c:'y',to:()=>go('patient',{pid:p.id}),target:m.to})});
  return out.concat(flowTodos()).map(x=>Object.assign({kind:'mgr'},x));
}
function mineFilter(x){
  const u=me();if(BOSS.includes(u.role))return true;if(x.kind==='mark')return true;const n=myName();
  if(isDocUser())return x.kind==='doc'&&docsOf(x.p).includes(n);
  if(u.role==='臨床')return x.kind==='msg'&&x.target==='櫃檯';
  if(x.kind==='msg')return x.target===n||(!x.target&&(x.p.mgr===n||x.p.consult===n))||(x.target==='櫃檯'&&u.role!=='醫師');
  if(x.kind==='doc')return false;return x.p.mgr===n||x.p.consult===n;
}
function myTodos(){return allTodos().filter(mineFilter).sort((a,b)=>(b.p.urgent?1:0)-(a.p.urgent?1:0)||(a.c==='r'?0:1)-(b.c==='r'?0:1))}

const scrollTo_=id=>`(document.getElementById('${id}')||{scrollIntoView(){}}).scrollIntoView({behavior:'smooth',block:'start'})`;
function nextStep(p){
  if(p.closed||p.done)return null;
  const q=p.quotes.at(-1),sq=signedQ(p);
  if(!p.xray&&!p.panoNote)return ['上傳 Pano 或填寫未拍原因',scrollTo_('sec-pano')];
  if(!p.teethDone&&!q)return ['標牙位',`go('mark',{pid:'${p.id}'})`];
  if(!q)return ['貼醫囑出報價',`act.newQuote('${p.id}')`];
  if(!sq){if(bucket(p)==='track')return ['登記追蹤','act.trackOpen()'];return ['請病人簽名（第 '+q.v+' 版）',`go('plan',{pid:'${p.id}',v:${q.v}})`]}
  if(!booked(p))return ['登記預約',scrollTo_('sec-nv')];
  if(needsData(p)){
    if(!p.collect)return ['登記資料收集','act.collect()'];
    if(!p.collect.cloud)return ['確認資料已上傳雲端',scrollTo_('sec-dc')];
    if(!p.design)return isDocUser()?['回報設計結果',scrollTo_('sec-design')]:['等待醫師設計',''];
    if(p.design.status==='lack'&&!p.redo)return ['回報補件安排',scrollTo_('sec-design')];
    if(p.design.status==='done'&&!(p.surgery&&p.surgery.date))return ['安排手術',scrollTo_('sec-surg')];
  }
  return ['療程中',''];
}

function dcStat(p){p.dc=p.dc||{};const got=DATA.filter(id=>p.dc[id]&&p.dc[id].got).length,up=DATA.filter(id=>p.dc[id]&&p.dc[id].up).length;return {L:DATA,got,up,total:got,done:!!(p.collect&&p.collect.cloud)}}

function caseStage(p){

  if(p.collect)return p.collect.cloud?['待設計','y']:['資料收集中','y'];
  if(signedQ(p))return needsData(p)?['已成交・待資收','y']:['療程中','g'];

function flowTodos(){
  const out=[];const t=todayISO();
  for(const p of S.patients){
    if(p.closed||p.done)continue;const mg=p.mgr?'（個管：'+p.mgr+'）':'';const sq=signedQ(p);const go_=()=>go('patient',{pid:p.id});
    if(!p.xray&&!p.panoNote&&!p.photosCleared)out.push({p,t:'尚未上傳 Pano',c:'r',to:go_});
    if(sq&&(p.nv||[]).length){const none=p.nv.filter(n=>n.status==='none').length;if(none&&booked(p))out.push({p,t:`NV ${p.nv.length} 項：已約 ${p.nv.filter(n=>n.status==='booked').length}、未約 ${none}${mg}`,c:'y',to:go_})}
    if(p.trackDue&&p.trackDue<=t)out.push({p,t:`追蹤第 ${(p.track||[]).length+1} 次：${p.trackWhy||''}${mg}`,c:p.trackDue<t?'r':'y',to:go_});
    if(sq&&needsData(p)&&!p.collect){const pl=p.collectPlan;out.push({p,t:pl?`預計 ${md(pl)} 資收${mg}`:`已成交・待安排資收${mg}`,c:pl&&pl<t?'r':'y',to:go_})}
    if(p.collect&&!p.collect.cloud){if(p.collect.date>=t)out.push({p,t:`今日資收・請確認資料已上傳雲端${mg}`,c:'y',to:go_});else out.push({p,t:`逾期未上傳雲端（${md(p.collect.date)} 資收）${mg}`,c:'r',to:go_})}
    if(p.collect&&p.collect.cloud&&!p.design)out.push({p,kind:'doc',t:'待設計：資料已上傳雲端',c:'y',to:go_});
    if(p.surgery&&p.surgery.date){const d=(new Date(p.surgery.date+'T00:00:00')-new Date(t+'T00:00:00'))/864e5;if(d>=0&&d<=7&&!(p.collect&&p.collect.cloud))out.push({p,t:`${md(p.surgery.date)} 手術：資料還沒上傳雲端${mg}`,c:'r',to:go_})}
    if(p.design&&p.design.status==='lack'){const L=p.design.lack;
      if(!p.redo)out.push({p,t:`補件：${L.items.map(exName).join('、')}｜最好 ${md(L.best)} 前、最晚 ${md(L.last)}${mg}`,c:t>L.best?'r':'y',to:go_});

  }
  return out;
}

/* ---- 醫囑解析 ---- */
function expandRange(a,b){
  for(const row of [UPPER,LOWER]){const i=row.indexOf(a),j=row.indexOf(b);if(i>=0&&j>=0){const [s,e]=i<j?[i,j]:[j,i];return row.slice(s,e+1)}}
  return [a,b];
}
function findItem(seg){
  const low=seg.toLowerCase();let best=null,len=0;
  for(const it of S.prices)for(const a of it.alias){const al=a.toLowerCase();if(!al||al.length<=len)continue;
    const hit=/^[a-z0-9 \-]+$/.test(al)?new RegExp('(^|[^a-z])'+al.replace(/[-]/g,'\\-')+'([^a-z]|$)').test(low):low.includes(al);
    if(hit){best=it;len=al.length}}
  return best;
}
function parseOrders(text){
  const items=[],bad=[],notes=[];
  const segs=text.split(/\n|＋|\+|；|;|，|,|。|\/(?=\D)/).map(s=>s.trim()).filter(Boolean);
  for(let seg of segs){
    if(/^[\s\d.]*折[\s優惠]*$/.test(seg))continue;
    let price=null,m;
    if((m=seg.match(/(\d+(?:\.\d+)?)\s*萬/))){price=Math.round(parseFloat(m[1])*10000);seg=seg.replace(m[0],' ')}
    else if((m=seg.match(/\$?\s?(\d{1,3}(?:,\d{3})+|\d{4,})/))){price=parseInt(m[1].replace(/,/g,''),10);seg=seg.replace(m[0],' ')}
    let teeth=[];
    seg=seg.replace(/(?<!\d)([1-4][1-8])\s*[-~～–]\s*([1-4][1-8])(?!\d)/g,(all,a,b)=>{teeth.push(...expandRange(+a,+b));return ' '});
    for(const tm of seg.matchAll(/(?<!\d)(\d{2})(?!\d)/g)){const n=+tm[1];if(/^[1-4][1-8]$/.test(tm[1]))teeth.push(n);else if(n>=10&&n<=49)bad.push(tm[1])}
    teeth=[...new Set(teeth)];
    const gift=/贈送|送/.test(seg);
    const whole=/全口/.test(seg);
    let it=findItem(seg);
    const immediate=/拔牙即種|即拔即種|拔牙即刻/.test(seg);
    if(immediate)it=priceOf('imp');
    if(!it&&price==null&&!teeth.length){if(seg.replace(/\s/g,''))notes.push(seg.trim());continue}

function altCard(q){
  if(!(q.alts||[]).length)return '';const p=P(V.pid);
  return `<div class="card" style="border-color:var(--orange)"><h2>方案（儲存時會出 ${q.alts.length} 版）</h2><p class="muted" style="margin:-4px 0 8px">上方「治療項目」是共同項目；每個方案各出一版計畫書，病人選定後簽那一版。</p>
   ${q.alts.map((a,ai)=>{const c=calc(p,Object.assign({},q,{items:q.items.concat(a.items),alts:[]}));return `<div class="card" style="margin:8px 0;background:var(--cream)"><div class="row"><b class="grow">${h(a.label)}</b><span class="muted">總額 NT$ ${money(c.total)}</span></div><div class="tablewrap"><table class="items"><tbody>${a.items.map((i,k)=>itemRow(i,k,ai)).join('')}</tbody></table></div></div>`}).join('')}</div>`;

function orderRate(text){const m=String(text||'').match(/(\d{1,2}(?:\.\d)?)\s*折/);if(!m)return null;let n=parseFloat(m[1]);n=n>=10?n/100:n/10;return n>0&&n<1?n:null}
const RATES={none:1,'95':0.95,'90':0.9};
function rateOf(q){return q.disc==='rate'?(q.rate||1):(RATES[q.disc]||1)}
const minsLabel=m=>m<60?m+' 分鐘':(m/60)+' 小時';
function checks(p,q){
  const out=[];const its=q.items;const all=q.orders||'';
  const hasExt=/拔/.test(all);
  const implantTeeth=new Set(its.filter(i=>i.pid==='imp').flatMap(i=>i.teeth));
  if(!p.teethDone)out.push(['y','尚未完成標牙位，無法和牙齒現況交叉比對']);
  for(const b of (q.bad||[]))out.push(['r',`醫囑裡的「${b}」不是有效牙位號碼，請問醫師`]);
  for(const i of its){
    const tt=i.teeth.length?i.teeth.join('、')+' ':'';
    if(!i.pid){out.push(['y',`無法辨識「${i.name}」，請在下方選擇項目`]);continue}
    const ref=priceOf(i.pid);
    if(i.auto)out.push(['y',`${tt}醫囑寫「${i.auto}」，已自動加上拔牙`]);
    else if(i.gift)out.push(['g',`${tt}${i.name}（贈送）`]);
    else out.push(['g',`已對應：${tt}${i.name}`]);
    if(i.price==null&&!i.gift)out.push(['y',`${i.name} 的價格待補，請填入金額`]);
    if(ref&&ref.min!=null&&i.price!=null&&!i.gift&&(i.price<ref.min||i.price>ref.max))out.push(['y',`${i.name} 金額 ${money(i.price)} 超出價目表範圍（${money(ref.min)}–${money(ref.max)}）`]);
    if(i.pid==='imp')for(const t of i.teeth){const s=p.teeth[t]&&p.teeth[t].s;
      if(s==='ok'||s==='root'||s==='crown'){const ext=its.some(x=>x.pid==='ext'&&x.teeth.includes(t));if(!ext&&!hasExt)out.push(['r',`${t} 號標為「${ST[s].label}」，醫囑寫植牙但沒提拔牙`]);else if(!ext)out.push(['y',`${t} 號有牙，醫囑有提到拔牙，請確認拔牙已列入`])}
      if(s==='imp')out.push(['r',`${t} 號標為「已有植體」，醫囑又寫植牙`]);}
    if(i.pid==='sinus')for(const t of i.teeth)if(isLower(t))out.push(['r',`鼻竇增高寫在下顎 ${t} 號，請問醫師`]);
    if(['graft','auto','bba'].includes(i.pid)&&i.teeth.length&&!i.teeth.some(t=>implantTeeth.has(t)))out.push(['y',`${tt}${i.name} 沒有搭配植牙，統計會歸類在「口外」`]);
    if(i.pid==='bridge')for(const t of i.teeth){const s=p.teeth[t]&&p.teeth[t].s;if(s==='ok'&&!hasExt)out.push(['y',`牙橋 ${t} 號標為「存在」，請確認是否需拔牙`])}
  }
  for(const n of (q.notes||[])){if(typeof n==='string')out.push(['y',`未辨識的文字：「${n}」`]);else if(n.k==='牙位待確認')out.push(['r',`牙位待確認：「${n.t}」，請和醫師確認要做什麼`])}
  for(const i of qItemsAll(q)){if(i.tbd)out.push(['y',`${i.name} 沒有寫牙位，顆數待確認`]);if(i.eval)out.push(['y',`${i.name} 需要評估，計畫書會顯示收費標準區間`])}
  return out;
}
function calc(p,q){
  const rate=rateOf(q);
  let listSum=0,finalSum=0;const lines=[];
  for(const i of q.items){
    if(i.gift||i.price==null||i.tbd){lines.push({list:0,final:0});continue}
    const list=(i.list!=null?Math.max(i.list,i.price):i.price)*i.qty;
    const final=Math.round(i.price*i.qty*rate);
    lines.push({list,final});listSum+=list;finalSum+=final;
  }
  const age=ageOf(p.chart);const child=age!=null&&age<=12;
  let sed=0,sedLabel='',sedFinal=0;
  const stype=SED_ALIAS[q.sed.type]||q.sed.type;const sd=SED[stype];
  if(sd&&sd.nhi){sedLabel='局部麻醉（健保給付）'}
  else if(stype!=='none'&&sd){
    const base=child&&sd.childBase?sd.childBase:sd.base;
    const inc=stype==='ao4'&&q.items.filter(i=>/^ao4/.test(i.pid)).reduce((a,i)=>a+i.qty,0)>=2?sd.incFull:sd.inc;
    const extra=Math.max(0,Math.ceil((Number(q.sed.hours||0)-inc)/0.5-1e-9));
    const one=base+extra*sd.over;sed=one*Math.max(1,+q.sed.count||1);
    sedLabel=stype==='ao4'?`All-on-4 麻醉：已含基本 ${inc} 小時${extra?`，超時 ${extra} 個半小時 × ${money(sd.over)}`:''}`:`${sd.label}${child&&sd.childBase?'（兒童）':''}：基本 ${sd.inc} 小時 ${money(base)}${extra?`＋超時 ${extra} 個半小時 × ${money(sd.over)}`:''}${(+q.sed.count||1)>1?` × ${q.sed.count} 次手術`:''}（預計 ${minsLabel(Math.round((+q.sed.hours||0)*60))}）`;
    sedFinal=Math.round(sed*rate);
  }
  const orig=listSum+sed;
  const afterRate=finalSum+sedFinal;
  const dAmt=q.disc==='amt'?(+q.discAmt||0):0;
  const mk=q.mkt&&MKT[q.mkt]?(q.mkt==='custom'?(+q.mktAmt||0):MKT[q.mkt].off):0;
  const total=afterRate-dAmt-mk;
  let dep=0;for(const i of q.items){const r=priceOf(i.pid);if(r&&r.dep&&!i.gift)dep+=r.dep*(r.unit==='區'||r.unit==='次'?1:i.qty)}
  return {lines,sed,sedFinal,sedLabel,orig,dAmt,mk,total,dep,child,rate,discounted:total<orig};
}

function xrayAnn(p,q){

    let grp=[];const flush=()=>{if(!grp.length)return;let a=grp[0],z=grp.at(-1);if(a>0&&st.imp.has(row.at(a-1)))a--;if(z<row.length-1&&st.imp.has(row.at(z+1)))z++;spans.push(row.slice(a,z+1));grp=[]};
    for(const i of idx){if(grp.length&&i!==grp.at(-1)+1)flush();grp.push(i)}flush();
  }
  for(const sp of spans){const pts=sp.map(pos).filter(Boolean);if(!pts.length)continue;
    const x1=Math.min(...pts.map(d=>d.x))-2.6,x2=Math.max(...pts.map(d=>d.x))+2.6,y=pts.reduce((s,d)=>s+d.y,0)/pts.length;
    out+=`<span class="a-bridge" style="left:${x1}%;width:${x2-x1}%;top:${y-7}%;height:14%"></span>`}

    else if(st.ext.has(t))sym=`<b class="a-x" style="left:${d.x}%;top:${d.y}%">×</b>`;
    else if(st.veneer.has(t))sym=`<span class="a-rect" style="left:${d.x}%;top:${d.y}%"></span>`;
    else if(st.crown.has(t))sym=`<span class="a-ic" style="left:${d.x}%;top:${d.y+(up?2:-2)}%;width:4%;height:5%;${up?'transform:translate(-50%,-50%) rotate(180deg)':''}">${CAP('#F7DF62')}</span>`;
    else if(s==='miss'||s==='none')sym=`<b class="a-xx" style="left:${d.x}%;top:${d.y}%">××</b>`;
    else if(s==='imp')sym=`<span class="a-ic" style="left:${d.x}%;top:${d.y}%;width:2.4%;height:12%">${SCREW('#9fc0e6')}</span>`;
    else if(s==='crown')sym=`<span class="a-ic" style="left:${d.x}%;top:${d.y+(up?2:-2)}%;width:4%;height:5%;${up?'transform:translate(-50%,-50%) rotate(180deg)':''}">${CAP('#F2C49E')}</span>`;
    else if(s==='root')sym=`<span class="a-dot" style="left:${d.x}%;top:${d.y}%"></span>`;
    if(st.graft[t])sym+=`<span class="a-graft" style="left:${d.x}%;top:${d.y+(up?-9:9)}%"></span>`;
    const hot=st.imp.has(t)||st.ext.has(t)||st.bridge.has(t)||st.veneer.has(t)||st.crown.has(t)||st.graft[t];
    out+=sym+`<span class="a-num ${hot?'hot':''}" style="left:${d.x}%;top:${d.y+(up?-15:24)}%">${t}</span>`;
  }
  return `<div class="s-xray ann"><img src="${I(p.xray)}" alt="全景 X 光">${out}</div>
  <div class="legend"><span><b style="color:#FD4F00">螺絲</b> 植牙</span><span><b style="color:#FD4F00">×</b> 拔牙</span><span><b style="color:#9b8a7d">××</b> 缺牙</span><span><i style="background:none;border:2px solid #E2C21F"></i>牙橋</span><span><i style="background:none;border:2px solid #fff;outline:1px solid #ccc"></i>貼片</span><span><i style="background:none;border:2px dashed #F2C49E;border-radius:50%"></i>補骨／鼻竇增高</span></div>`;
}
function estPos(p,t){
  const d=p.teeth[t];if(d&&d.x!=null)return d;
  const row=UPPER.includes(t)?UPPER:LOWER;const i=row.indexOf(t);
  const known=row.map((tt,k)=>{const e=p.teeth[tt];return e&&e.x!=null?{k,x:e.x,y:e.y}:null}).filter(Boolean);
  const curve=k=>Math.pow((k-7.5)/7.5,2)*5;
  if(known.length>=2){
    let L=null,R=null;for(const e of known){if(e.k<i&&(!L||e.k>L.k))L=e;if(e.k>i&&(!R||e.k<R.k))R=e}
    if(!L||!R){const side=known.filter(e=>!L?e.k>i:e.k<i).sort((a,b)=>Math.abs(a.k-i)-Math.abs(b.k-i));const a=side[0],b=side[1]||side[0];
      const dx=a.k===b.k?3.4:(a.x-b.x)/(a.k-b.k),dy=a.k===b.k?0:(a.y-b.y)/(a.k-b.k);return {x:a.x+dx*(i-a.k),y:a.y+dy*(i-a.k),est:true}}
    const f=(i-L.k)/(R.k-L.k);return {x:L.x+(R.x-L.x)*f,y:L.y+(R.y-L.y)*f,est:true};
  }
  if(known.length===1){const a=known[0];return {x:a.x+(i-a.k)*3.4,y:a.y+(row===UPPER?-1:-1)*(curve(i)-curve(a.k)),est:true}}
  return {x:22+i*(56/15),y:(row===UPPER?45:58)-curve(i),est:true};
}

function chartSVG(p,q){
  const st=planSets(q);const imp=st.imp,bridge=st.bridge,graft=st.graft;
  const W=t=>{const d=t%10;return d>=6?40:d>=4?33:30};
  const gap=3,total=UPPER.reduce((s,t)=>s+W(t)+gap,0)-gap,x0=(740-total)/2;
  let svg=`<svg viewBox="0 0 740 262" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans TC, sans-serif">`;
  svg+=`<rect x="${x0-6}" y="68" width="${total+12}" height="14" rx="7" fill="#F9EBDB"/><rect x="${x0-6}" y="180" width="${total+12}" height="14" rx="7" fill="#F9EBDB"/><line x1="370" y1="24" x2="370" y2="240" stroke="#EBD3BC" stroke-dasharray="3 4"/>`;
  const row=(list,cy,dir,ly)=>{let x=x0;for(const t of list){const w=W(t),hgt=42;const s=p.teeth[t]?p.teeth[t].s:'ok';
    let fill='#fff',stroke='#C9B09A',dash='';
    if(imp.has(t)){fill='#FD4F00';stroke='#FD4F00'}else if(bridge.has(t)){fill='#F7DF62';stroke='#D9BC33'}else if(s==='imp'){fill='#5b6f86';stroke='#5b6f86'}else if(s==='crown'){fill='#F2C49E';stroke='#d9a57a'}else if(s==='miss'||s==='none'){dash='4 3'}
    if(imp.has(t)){const px=x+w/2-6,py=dir<0?cy-24:cy+hgt;svg+=`<rect x="${px}" y="${py}" width="12" height="24" rx="2" fill="#8A7362"/>`}
    else if(!(s==='miss'||s==='none')&&!bridge.has(t)){const ry=dir<0?cy:cy+hgt;svg+=`<path d="M${x+6} ${ry} L${x+w/2} ${ry+dir*24} L${x+w-6} ${ry}" fill="#fff" stroke="#C9B09A"/>`}
    if(s==='root'&&!imp.has(t))svg+=`<circle cx="${x+w/2}" cy="${cy+hgt/2}" r="6" fill="#a8452a"/>`;
    svg+=`<rect x="${x}" y="${cy}" width="${w}" height="${hgt}" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="1.5" ${dash?`stroke-dasharray="${dash}"`:''} ${s==='root'&&!imp.has(t)?'fill-opacity="0"':''}/>`;
    if(graft[t]){const gy=dir<0?cy-38:cy+hgt+38;svg+=`<circle cx="${x+w/2}" cy="${gy}" r="15" fill="#F2C49E"/><text x="${x+w/2}" y="${gy+4.5}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A2A20">${graft[t]}</text>`}
    svg+=`<text x="${x+w/2}" y="${ly}" text-anchor="middle" font-size="17" font-weight="${imp.has(t)||bridge.has(t)?700:500}" fill="${imp.has(t)?'#FD4F00':'#8A7362'}">${t}</text>`;
    x+=w+gap}};
  row(UPPER,82,-1,18);row(LOWER,138,1,258);
  return svg+'</svg>';
}

  del(kind,ref){const D=delInfo(kind,ref);if(!D)return;modal(`<h2>刪除前確認</h2><p style="margin:0 0 8px"><b>${h(D.label)}</b></p>

function modal(html){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="sheetbox">${html}</div>`;m.onclick=e=>{if(e.target===m)closeModal()};document.body.appendChild(m)}

function setupPad(){
  const c=document.getElementById('pad');const r=c.getBoundingClientRect();const k=window.devicePixelRatio||1;c.width=r.width*k;c.height=r.height*k;
  const x=c.getContext('2d');x.scale(k,k);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#1d1410';
  let down=false;const pos=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);const [a,b]=pos(e);x.beginPath();x.moveTo(a,b)};
  c.onpointermove=e=>{if(!down)return;const [a,b]=pos(e);x.lineTo(a,b);x.stroke();c.dataset.ink='1'};
  c.onpointerup=c.onpointercancel=()=>{down=false};
}
function compress(file,max,qual,gray){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');if(gray)x.filter='grayscale(1)';x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',qual))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function sampleXray(){
  if(_sx)return _sx;
  const c=document.createElement('canvas');c.width=1400;c.height=640;const x=c.getContext('2d');
  const g=x.createRadialGradient(700,330,60,700,330,720);g.addColorStop(0,'#6d6d6d');g.addColorStop(.6,'#2b2b2b');g.addColorStop(1,'#0d0d0d');x.fillStyle=g;x.fillRect(0,0,1400,640);
  const arch=(row,yBase,dir)=>{row.forEach((t,i)=>{const u=(i-7.5)/7.5;const cx=700+u*470;const cy=yBase-dir*Math.pow(Math.abs(u),2)*70;const w=[6,7,8].includes(t%10)?50:t%10>=4?40:34;
    x.save();x.translate(cx,cy);x.rotate(u*0.18*dir);const lg=x.createLinearGradient(0,-80,0,80);lg.addColorStop(0,'rgba(235,235,235,.85)');lg.addColorStop(1,'rgba(150,150,150,.35)');x.fillStyle=lg;
    x.beginPath();x.roundRect?x.roundRect(-w/2,dir>0?-60:-30,w,90,14):x.rect(-w/2,dir>0?-60:-30,w,90);x.fill();x.fillStyle='rgba(200,200,200,.35)';x.fillRect(-6,dir>0?30:-110,12,80);x.restore()})};
  arch(UPPER,300,1);arch(LOWER,380,-1);
  x.fillStyle='rgba(255,255,255,.75)';x.font='bold 26px sans-serif';x.fillText('R',24,610);x.font='16px sans-serif';x.fillText('範例 X 光（示意）',60,610);
  _sx=c.toDataURL('image/jpeg',0.8);return _sx;
}
